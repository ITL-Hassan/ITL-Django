<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー登録</title>
    <style>
      body {
          max-width: 400px;
          margin: 50px auto;
          padding: 20px;
          border: 1px solid #ddd;
          border-radius: 5px;
          box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
          text-align: center;
      }
      form {
          display: flex;
          flex-direction: column;
      }
      label {
          margin-top: 10px;
          font-weight: bold;
      }
      input {
          padding: 8px;
          margin-top: 5px;
          border: 1px solid #ccc;
          border-radius: 4px;
      }

      #submit {
          margin-top: 20px;
          padding: 10px;
          background-color: #28a745;
          color: white;
          border: none;
          border-radius: 4px;
          cursor: pointer;
      }
      #submit:hover {
          background-color: #218838;
      }
      .error {
          color: red;
          font-size: 0.9em;
      }
      .login-link {
          text-align: center;
          margin-top: 15px;
      }

    </style>
  </head>

  <body>
    <h2>ユーザー登録</h2>
    <form method="post">
      {% csrf_token %}

      <label>ユーザー名:</label>
      {{ form.username }}
      {% if form.username.errors %}
        <p class="error">{{ form.username.errors.0 }}</p>
      {% endif %} 

      <!-- 
        長いので省略。ユーザー名と同じように以下4つの項目も作る
        メールアドレス email
        パスワード     password1
        パスワード（確認）  password2
       -->

      <input id="submit" type="submit" value="登録">
    </form>

    <div class="login-link">
      <p>すでにアカウントをお持ちですか？
        <a href="/my_app/accounts/login/">ログイン</a></p>
    </div>
  </body>

</html>
