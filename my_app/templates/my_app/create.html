<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>入力画面</title>    
</head>

<body>
  <h1>{{ title }}</h1>

  <form action="{% url 'my_app:create' %}" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <p>
      <label>名前:</label>
      {{ form.name }}
      <div style="color: #FF0000;">{{ form.name.errors }}</div>
    </p>

    <p>
      <label>年齢:</label>
      {{ form.age }}
      <div style="color: #FF0000;">{{ form.age.errors }}</div>
    </p>
  
    <p>
      <label for="id_img">画像:</label>
      {{ form.image }}
      <div style="color: #FF0000;">{{ form.img.errors }}</div>
    </p>

    <input type="submit" value="送信">
  </form>

</body>
