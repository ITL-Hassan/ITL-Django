<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>タイトル</title>

  <style>
    th, td {
      border: 1px solid #000;
      padding: 3px 20px;
    }
    table {
      border-collapse: collapse;
    }
    thead {
      background-color: #1251fd;
      color : #FFF;
    }
    tbody tr:nth-child(odd) {
      background-color: #b6dbfc;
    }

    h1,
    form {
      display: inline-block;
    }

  </style>
    
</head>

<body>

  <header>
    <h1>indexページ</h1>
    
    <form action='{% url "my_app:logout" %}' method='post' name='logout'>
      {% csrf_token %}
      <a href="javascript:logout.submit()">Logout</a>
    </form>
  </header>
  
  <table>
    <thead>
      <tr>
      {% for col in header %}
        <th>{{ col }}</th>
      {% endfor %}
        <th>アクション</th>
      </tr>
    </thead>
    
    <tbody>
      {% for item in members %}
      <tr>
        <td>{{ item.id }}</td>
        <td>{{ item.name }}</td>
        <td>{{ item.age }}</td>
        <td>
          <a href="{% url 'my_app:update' item.id %}">更新</a>
          <a href="{% url 'my_app:delete' item.id %}">削除</a> 
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <a href="/my_app/create">追加する</a>
</body>
